global:
  scrape_interval: 15s
scrape_configs:
  - job_name: rackwise-backend
    metrics_path: /actuator/prometheus
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/scrape-token   # mounted from METRICS_SCRAPE_TOKEN, see docker-compose.yml
    static_configs:
      - targets: ['backend:8080']
