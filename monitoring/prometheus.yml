global:
  scrape_interval: 15s
scrape_configs:
  - job_name: rackwise-backend
    metrics_path: /actuator/prometheus
    authorization:
      type: Bearer
      credentials_file: /tmp/scrape-token   # written from METRICS_SCRAPE_TOKEN by the prometheus service command in docker-compose.yml
    static_configs:
      - targets: ['backend:8080']
