spring:
  application:
    name: capacity-desk
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${POSTGRES_PORT:5440}/${POSTGRES_DB:capacitydesk}
    username: ${POSTGRES_USER:capacitydesk}
    password: ${POSTGRES_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  jackson:
    deserialization:
      # missing primitives become 0/false and are rejected by Bean Validation with a field-level message
      fail-on-null-for-primitives: false
  flyway:
    clean-disabled: true
  data:
    web:
      pageable:
        max-page-size: 100
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
  endpoint:
    health:
      show-details: never
capacitydesk:
  jwt:
    secret: ${JWT_SECRET}   # >= 32 bytes, required
    issuer: rackwise
    ttl: 15m
  cors:
    allowed-origins: http://localhost:5173
  metrics:
    scrape-token: ${METRICS_SCRAPE_TOKEN:}   # optional static bearer token for Prometheus; grants role METRICS only. Unset = disabled
  assistant:
    llm:                       # optional; off by default. The local deterministic assistant is always available.
      enabled: false
      api-key: ${GEMINI_API_KEY:}
      model: gemini-2.0-flash
      timeout: 4s
      retries: 1
